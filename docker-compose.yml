name: vivido

services:
  # ══════════════════════════════════════════════════
  #  Hafta 1'den itibaren gerekli
  # ══════════════════════════════════════════════════
  postgis:
    # DİKKAT: postgres:16 DEĞİL — PostGIS eklentisi gelmez.
    image: postgis/postgis:16-3.4
    container_name: vivido-postgis
    # "etl" de dahil: ETL osm2pgsql ile doğrudan bu veritabanına yazar,
    # yani etl profili tek başına açıldığında da postgis ayakta olmalı.
    profiles: ["dev", "full", "etl"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vivido}
      POSTGRES_USER: ${POSTGRES_USER:-vivido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vivido}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # ⛔ `./db/schema:/docker-entrypoint-initdb.d` MOUNT'U KALDIRILDI.
      #
      # initdb.d yalnızca konteyner İLK AÇILDIĞI ANDA var olan dosyaları
      # çalıştırır ve defter tutmaz. Sonradan eklenen şema dosyaları hiç
      # uygulanmadığı hâlde migrate.sh'in baseline'ı onları "uygulandı"
      # sayıyordu — staging'de `first_name`, `last_name` sütunları ve
      # `user_profile_category_order` tablosu böyle eksik kaldı.
      #
      # Artık ŞEMANIN TEK UYGULAYICISI migrate.sh. Boş bir volume'de bile
      # tüm dosyaları sırayla uygular ve deftere yazar:
      #
      #     pnpm infra:up
      #     pnpm db:migrate      ← artık zorunlu adım
      - ./db/checks:/checks:ro
      # ETL çıktısı (seed.sql). Git'e girmez, 00_fetch_artifacts.sh ile gelir.
      # Buradan yüklenir:
      #   docker compose exec -T postgis psql -U vivido -d vivido -f /seed/seed.sql
      - ./data/artifacts:/seed:ro
      # Sonraki şema değişiklikleri için: db/migrate.sh yalnızca
      # uygulanmamış dosyaları çalıştırır (pnpm db:migrate).
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vivido} -d ${POSTGRES_DB:-vivido}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vivido-redis
    profiles: ["dev", "full"]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - vivido-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vivido-pgadmin
    profiles: ["dev"]
    environment:
      # DİKKAT: pgAdmin .local / .test gibi ayrılmış alan adlarını reddeder
      # ve konteyner sonsuz yeniden başlama döngüsüne girer.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-dev@vivido.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-vivido}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_HOST_PORT:-5051}:80"
    depends_on:
      postgis:
        condition: service_healthy
    restart: unless-stopped

  # ══════════════════════════════════════════════════
  #  Hafta 2'den itibaren — veri artefaktları gerekli
  #  data/scripts/00_fetch_artifacts.sh çalıştırılmadan
  #  bu servisler BAŞLAMAZ. Bu yüzden ayrı profilde.
  # ══════════════════════════════════════════════════
  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: vivido-osrm-foot
    profiles: ["routing", "full"]
    command: >
      osrm-routed --algorithm mld
      --max-table-size ${Routing__MaxTableSize:-200}
      /data/cankaya.osrm
    volumes:
      - ./data/artifacts/osrm/foot:/data:ro
    ports:
      - "${OSRM_FOOT_HOST_PORT:-5101}:5000"
    restart: unless-stopped

  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: vivido-osrm-car
    profiles: ["routing", "full"]
    command: >
      osrm-routed --algorithm mld
      --max-table-size ${Routing__MaxTableSize:-200}
      /data/cankaya.osrm
    volumes:
      - ./data/artifacts/osrm/car:/data:ro
    ports:
      - "${OSRM_CAR_HOST_PORT:-5102}:5000"
    restart: unless-stopped

  tileserver:
    image: maptiler/tileserver-gl:latest
    container_name: vivido-tileserver
    profiles: ["routing", "full"]
    command: ["--mbtiles", "/data/cankaya.mbtiles", "--port", "8080"]
    volumes:
      - ./data/artifacts:/data:ro
    ports:
      - "${TILESERVER_HOST_PORT:-8081}:8080"
    restart: unless-stopped

  # ══════════════════════════════════════════════════
  #  ETL araç kutusu — YALNIZCA ETL makinesinde.
  #
  #  Ekipte tek kişi çalıştırır, çıktıları GitHub Release'e yükler.
  #  Diğerleri data/scripts/00_fetch_artifacts.sh ile indirir ve bu
  #  profile hiç dokunmaz (§12.2 "ETL tek makinede bir kez").
  #
  #  Tek seferlik çalıştırma için tasarlandı:
  #    docker compose --profile etl build etl
  #    docker compose --profile etl run --rm etl osmium fileinfo data/artifacts/cankaya.osm.pbf
  #    docker compose --profile etl run --rm etl bash
  # ══════════════════════════════════════════════════
  etl:
    build:
      context: ./data
      dockerfile: Dockerfile.etl
    image: vivido-etl:local
    container_name: vivido-etl
    profiles: ["etl"]
    environment:
      # psql / osm2pgsql bu değişkenleri kendiliğinden okur — her komutta
      # -h -U -d yazmaya gerek kalmaz. Host adı `postgis`: aynı compose ağı.
      PGHOST: postgis
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-vivido}
      PGUSER: ${POSTGRES_USER:-vivido}
      PGPASSWORD: ${POSTGRES_PASSWORD:-vivido}
      DATA_VERSION: ${DATA_VERSION:-osm-2026-08-20}
    volumes:
      - ./data:/work/data
      - ./db:/work/db
    working_dir: /work
    depends_on:
      postgis:
        condition: service_healthy

  # Harita tile üretimi (§9.7). Java kurulumu gerekmez.
  #   docker compose --profile etl run --rm planetiler \
  #     --osm-path=/data/artifacts/cankaya.osm.pbf \
  #     --output=/data/artifacts/cankaya.mbtiles --force
  planetiler:
    image: ghcr.io/onthegomap/planetiler:latest
    container_name: vivido-planetiler
    profiles: ["etl"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx4g"
    volumes:
      - ./data:/data

  # ══════════════════════════════════════════════════
  #  Konteynerize uygulama — yalnızca "full" profilinde.
  #  Geliştirirken API ve web'i host'ta çalıştırmak
  #  (pnpm dev:api / dev:web) çok daha hızlıdır.
  # ══════════════════════════════════════════════════
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: vivido-api
    profiles: ["full"]
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__Default: Host=postgis;Port=5432;Database=${POSTGRES_DB:-vivido};Username=${POSTGRES_USER:-vivido};Password=${POSTGRES_PASSWORD:-vivido}
      ConnectionStrings__Redis: redis:6379
      Routing__FootUrl: http://osrm-foot:5000
      Routing__CarUrl: http://osrm-car:5000
      Tiles__BaseUrl: http://tileserver:8080
      # E-posta doğrulama / şifre sıfırlama (K-09).
      # Varsayılan `console`: e-posta gönderilmez, kod konteyner loglarına basılır
      # (`docker compose logs -f api`). Gerçek gönderim için .env'e Email__* yaz.
      # ⭐ DOĞRULAMA AÇIK — yerelde de. Bir süre kapalıydı (yeni özellikler
      # denenirken her kayıtta 6 haneli kod girmek yavaşlatıyordu); akış
      # yeniden test edileceği için geri açıldı. Artık yerel davranış
      # staging/production ile AYNI: kayıt 201 değil 202 döner, web ve mobil
      # doğrulama ekranına gider.
      #
      # Kod e-posta ile GÖNDERİLMEZ: yukarıdaki `Email__Provider=console`
      # yüzünden api loglarına basılıyor → `docker compose logs -f api`.
      # Geçici olarak kapatmak isteyen `.env` içine
      # `Auth__RequireEmailVerification=false` yazabilir; bu dosyayı
      # değiştirmesi gerekmez.
      Auth__RequireEmailVerification: ${Auth__RequireEmailVerification:-true}
      Email__Provider: ${Email__Provider:-console}
      Email__Host: ${Email__Host:-smtp.gmail.com}
      Email__Port: ${Email__Port:-587}
      Email__User: ${Email__User:-}
      Email__Password: ${Email__Password:-}
      Email__FromAddress: ${Email__FromAddress:-}
      Email__FromName: ${Email__FromName:-Vivido}
    ports:
      - "${API_HOST_PORT:-5003}:5000"
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5003/api/v1}
        VITE_TILE_STYLE_URL: ${VITE_TILE_STYLE_URL:-http://localhost:8081/styles/basic/style.json}
        VITE_TILE_URL: ${VITE_TILE_URL:-http://localhost:8081/data/v3.json}
        VITE_GLYPHS_URL: ${VITE_GLYPHS_URL:-http://localhost:8081/fonts/{fontstack}/{range}.pbf}
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-false}
    image: vivido-web:local
    container_name: vivido-web
    profiles: ["full"]
    env_file:
      - .env
    ports:
      - "${WEB_HOST_PORT:-8082}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
    name: ${POSTGRES_VOLUME_NAME:-vivido-pgdata}
  vivido-redisdata:
    name: ${REDIS_VOLUME_NAME:-vivido-redisdata}

networks:
  default:
    name: vivido-network
