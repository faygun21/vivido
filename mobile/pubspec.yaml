name: vivido_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: 1.6.0
  flutter_secure_storage: 10.3.1
  maplibre: 0.3.5
  flutter_svg: ^2.0.10
  geolocator: ^14.0.3
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Flutter paketleri ve varlıkları yapılandırma
flutter:
  config:
    enable-swift-package-manager: true

  uses-material-design: true

  # Poppins fontu tanımlandı
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  assets:
    - assets/images/vivido_logo.svg
    - assets/images/ev_resmi.png
    # Çankaya ilçe sınırı. web/public/geo/cankaya.geojson'ın KOPYASI —
    # webde sınır çiziliyordu, mobilde hiç yoktu ve harita nerede bittiği
    # belirsiz duruyordu. Uygulama ile paketleniyor: 124 KB, ağa bağlı
    # olmadan da çiziliyor. Web tarafı güncellenirse bu dosya da güncellenmeli.
    - assets/geo/cankaya.geojson
    # Mahalle poligonları — web/public/geo/cankaya-mahalleler.geojson KOPYASI.
    # Web haritada mahalle sınırlarını çiziyordu, mobil yalnızca ilçe
    # sınırını; kullanıcı hangi mahallede olduğunu göremiyordu. 252 KB.
    - assets/geo/cankaya-mahalleler.geojson
    # Harita ikonları — web/public/*.svg'nin KOPYALARI. Konut ve POI
    # kategorileri iki üründe aynı simgeyle gösterilsin diye aynı dosyalar
    # kullanılıyor (web tarafı değişirse buradakiler de yenilenmeli).
    #
    # Persona ikonları (kep/pc/family/glasses) ve favori yıldızı
    # (star_kahve/star_white) sonradan eklendi: mobil bunların yerine
    # jenerik Material glyph'leri kullanıyordu.
    - assets/icons/
    # Rehber maskotu — web/public/mascot*.png KOPYALARI.
    - assets/mascot/