# Vite çıktısını sunan nginx yapılandırması.
#
# TLS, sıkıştırma ve `/api` yönlendirmesi BURADA DEĞİL — onlar Caddy'nin işi
# (bkz. deploy/Caddyfile). Bu dosya yalnızca statik dosya sunuyor.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ⭐ SPA geri dönüşü — bunsuz uygulama F5'te kırılır.
    #
    # React Router yolları (/auth/verify-email, /explore …) sunucuda
    # KARŞILIĞI OLMAYAN yollar. Kullanıcı o adreste sayfayı yenilediğinde
    # ya da doğrudan linke tıkladığında nginx dosyayı bulamayıp 404 döner.
    # Uygulama içi gezinmede sorun görünmez; hata yalnızca yenilemede
    # ortaya çıkar ve bu yüzden geç fark edilir.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite varlık adlarına içerik hash'i basıyor (app-a1b2c3.js).
    # İçerik değişince ad değişiyor, o yüzden sonsuza kadar cache'lenebilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html cache'lenmemeli: hash'li varlıkların adresi burada.
    # Cache'lenirse kullanıcı yeni sürümü aylarca görmez.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Arama motorları bu siteyi indekslemesin.
    #
    # K-06: konut verisi SENTETİK. Uydurma kiralık ev ilanlarının Google'da
    # gerçek ilan gibi çıkması istenmeyen bir sorumluluk doğurur.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Sunucu sürümünü yanıt başlığında duyurma.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
