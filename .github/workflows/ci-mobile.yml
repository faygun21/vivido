name: ci-mobile

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'packages/**', 'pnpm-lock.yaml', '.github/workflows/ci-mobile.yml']
  pull_request:
    paths: ['mobile/**', 'packages/**', 'pnpm-lock.yaml', '.github/workflows/ci-mobile.yml']

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # NOT: Mobil uygulama CI'da DERLENMEZ — Android build'i 15+ dakika sürer
  # ve her PR'da çalıştırmak anlamsızdır. APK üretimi EAS ile elle yapılır.
  # Burada tip güvenliği ve saf mantık (adım durum makinesi) test edilir.
  typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sürüm BİLEREK verilmiyor: action, package.json'daki
      # "packageManager": "pnpm@11.22.0" alanını okur. İkisi birden
      # yazılırsa "Multiple versions of pnpm specified" ile kırılır.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Bağımlılıklar
        run: pnpm install --frozen-lockfile

      - name: Tip kontrolü
        run: pnpm --filter mobile exec tsc --noEmit

      - name: Lint
        run: pnpm --filter mobile lint
        continue-on-error: true   # Hafta 1'de lint kuralları henüz oturmadı

      - name: Testler (adım durum makinesi + manevra çevirisi)
        run: pnpm --filter mobile test
