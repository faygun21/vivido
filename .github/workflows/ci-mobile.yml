name: ci-mobile

on:
  push:
    branches: [main, dev]
    paths:
      - "mobile/**"
      - ".github/workflows/ci-mobile.yml"

  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/ci-mobile.yml"

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter kalite kontrolleri
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi checkout et
        uses: actions/checkout@v4

      - name: Flutter 3.47.0 kur
        shell: bash
        run: |
          git clone https://github.com/flutter/flutter.git \
            --depth 1 \
            --branch 3.47.0 \
            "$HOME/flutter"

          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter sürümünü doğrula
        run: flutter --version

      - name: Bağımlılıkları yükle
        working-directory: mobile
        run: flutter pub get

      - name: Format kontrolü
        working-directory: mobile
        run: dart format --set-exit-if-changed lib test

      - name: Statik analiz
        working-directory: mobile
        run: flutter analyze

      - name: Testleri çalıştır
        working-directory: mobile
        run: flutter test
