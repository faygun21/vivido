name: ci-web

on:
  push:
    branches: [main]
    paths: ['web/**', 'packages/**', 'pnpm-lock.yaml', '.github/workflows/ci-web.yml']
  pull_request:
    paths: ['web/**', 'packages/**', 'pnpm-lock.yaml', '.github/workflows/ci-web.yml']

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sürüm BİLEREK verilmiyor: action, package.json'daki
      # "packageManager": "pnpm@11.22.0" alanını okur. İkisi birden
      # yazılırsa "Multiple versions of pnpm specified" ile kırılır.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Bağımlılıklar
        run: pnpm install --frozen-lockfile

      - name: Tip kontrolü
        run: pnpm --filter web exec tsc --noEmit

      - name: Lint
        run: pnpm --filter web lint
        continue-on-error: true   # Hafta 1'de lint kuralları henüz oturmadı

      - name: Testler
        run: pnpm --filter web test --run

      - name: Build
        run: pnpm --filter web build

      # ⭐ MapLibre worker parçası çıktıya girdi mi?
      #
      # MapLibre 6 worker dosyasının adını ÇALIŞMA ANINDA kuruyor
      # (`dev ? '…-worker-dev.mjs' : '…-worker.mjs'`). Vite 8 / Rolldown bunu
      # statik olarak göremeyip parçayı çıktıya HİÇ EKLEMEYEBİLİYOR.
      #
      # Olduğunda belirti sinsi: MapLibre GeoJSON ayrıştırmayı ve karo
      # çizimini worker'da yapar, worker ölünce hiçbir veri katmanı çizilmez —
      # ama arka plan, +/− kontrolü ve atıf ana iş parçacığında olduğu için
      # çalışmaya devam eder. Harita "var" görünür, bomboştur ve HATA
      # FIRLATMAZ; tarayıcı konsolu tertemiz kalır. Ne build, ne test, ne
      # typecheck yakalar.
      #
      # Bu tam olarak yaşandı ve haftalarca fark edilmedi çünkü herkes
      # `pnpm dev` kullanıyordu (docs/04-MEVCUT-DURUM.md §5.5).
      # Düzeltme: web/src/shared/map/CankayaMap.tsx → setWorkerUrl().
      - name: Harita worker parçası üretildi mi
        run: |
          if ! ls web/dist/assets/maplibre-gl-worker-*.js >/dev/null 2>&1; then
            echo "::error file=web/src/shared/map/CankayaMap.tsx::maplibre-gl-worker parçası üretilmedi — harita üretimde boş çizilir (bkz. docs/04-MEVCUT-DURUM.md §5.5)"
            ls -la web/dist/assets/
            exit 1
          fi
          echo "✓ $(ls web/dist/assets/maplibre-gl-worker-*.js)"
